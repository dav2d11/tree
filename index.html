<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>구조도 암기</title>
<style>
:root{
  --bg:#090b10; --panel:#12151c; --panel2:#181c26; --line:#232937; --line2:#2e3649;
  --text:#e8ebf2; --sub:#8c95a8; --mute:#5b6479;
  --accent:#92a3ff; --accent-bg:rgba(146,163,255,.12);
  --ok:#5fd6a4; --ok-bg:rgba(95,214,164,.10);
  --bad:#ff7b88; --bad-bg:rgba(255,123,136,.10);
  --warn:#f0c674;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; padding:28px 20px; display:flex; justify-content:center; min-height:100vh;
  font-family:"Pretendard Variable","Pretendard","Inter","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:radial-gradient(1100px 520px at 50% -180px,#182036 0%,transparent 70%),var(--bg);
  color:var(--text); -webkit-font-smoothing:antialiased;
}
.app{width:100%; max-width:1180px;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#262d3d;border-radius:10px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#343d52;background-clip:content-box;border:2px solid transparent;}
::-webkit-scrollbar-corner{background:transparent;}

/* 아이콘: 굵은 선 SVG */
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.ic.lg{width:24px;height:24px;}

/* 버튼 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:inherit;font-size:13px;font-weight:600;letter-spacing:-.01em;
  padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--text);
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s;
}
.btn:hover{background:var(--panel2);border-color:#3b4560;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#0a0d1c;}
.btn-primary:hover{background:#a9b6ff;border-color:#a9b6ff;}
.btn-danger:hover{color:var(--bad);border-color:rgba(255,123,136,.5);background:var(--bad-bg);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;}
.btn.icon-only{padding:7px 9px;}

.panel{
  background:linear-gradient(180deg,var(--panel),#0f1218);
  border:1px solid var(--line);border-radius:18px;padding:26px;
}
.row{display:flex;align-items:center;gap:8px;}
.spacer{flex:1;}
h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:12px 0 4px;}
.empty-msg{grid-column:1/-1;color:var(--mute);font-size:13px;text-align:center;padding:48px 0;}

/* 상단 브랜드 */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding:0 4px;}
.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:var(--accent-bg);border:1px solid rgba(146,163,255,.28);}
.brand-title{font-size:20px;font-weight:800;letter-spacing:-.03em;}
.brand-sub{font-size:12px;color:var(--sub);margin-top:2px;}

/* 목록 */
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;}
.toolbar .btn-primary{flex:1.2;}
.toolbar .btn:not(.btn-primary){flex:1;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:16px;}
.card{
  background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:10px;cursor:grab;transition:border-color .15s,transform .15s,background .15s;
}
.card:hover{border-color:var(--line2);transform:translateY(-2px);}
.card:active{cursor:grabbing;}
.card.folder{background:linear-gradient(180deg,#1a1d33,#151828);border-color:#2d3256;}
.card-title{font-size:15px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;line-height:1.35;}
.card.folder .card-title{color:var(--accent);}
.card-meta{font-size:12px;color:var(--sub);display:flex;gap:10px;}
.meta-wrong{color:var(--bad);font-weight:700;}
.card-actions{display:flex;gap:6px;margin-top:2px;}
.card-actions .btn{flex:1;}
.card-actions .btn.icon-only{flex:0 0 auto;}
.card.dragging{opacity:.35;}
.card.drop-before{outline:2px solid var(--accent);outline-offset:2px;}
.card.drop-into{outline:2px dashed var(--accent);outline-offset:2px;background:#202547;}
#btnTrFolderBack.drop-into{outline:2px dashed var(--accent);background:#202547;}

/* 편집 */
.form-group{margin-bottom:14px;}
.form-group label,.col-title{display:block;font-size:12px;color:var(--sub);margin-bottom:7px;font-weight:600;}
.form-group input{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line2);background:#0a0c12;color:var(--text);
  font-size:14px;outline:none;font-family:inherit;
}
.form-group input:focus,#trOutlineInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(146,163,255,.14);}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
#trOutlineInput{
  width:100%;min-height:440px;background:#0a0c12;border:1px solid var(--line2);color:var(--text);border-radius:12px;
  padding:14px;font-size:13px;line-height:1.65;font-family:"SFMono-Regular",Menlo,Consolas,monospace;resize:vertical;outline:none;
}
.preview{background:#0a0c12;border:1px solid var(--line2);border-radius:12px;padding:10px;height:440px;overflow-y:auto;font-size:13px;}
.preview-empty{color:var(--mute);text-align:center;padding:60px 0;}
.pv-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;}
.pv-row:hover{background:rgba(255,255,255,.035);}
.pv-mark{width:8px;height:8px;border-radius:50%;background:var(--mute);flex-shrink:0;}
.pv-mark.branch{background:transparent;border:2.5px solid var(--accent);}
.pv-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.pv-thumb{width:20px;height:20px;object-fit:contain;background:#000;border-radius:5px;border:1px solid var(--line2);}
.pill{
  flex-shrink:0;font:inherit;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid var(--line2);color:var(--sub);transition:all .15s;
}
.pill:hover{border-color:var(--accent);color:var(--text);}
.pill.on{border-color:rgba(146,163,255,.5);color:var(--accent);background:var(--accent-bg);}
.cfg{background:#0e1118;border:1px solid var(--line2);border-radius:10px;padding:12px;margin:4px 0 8px 18px;display:flex;flex-direction:column;gap:10px;}
.cfg-text{background:#080a0f;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.9;letter-spacing:.5px;}
.cfg-char{display:inline-block;cursor:pointer;border-radius:4px;padding:0 1px;transition:background .1s,color .1s;}
.cfg-char.blank{background:var(--accent-bg);color:var(--accent);font-weight:700;text-decoration:underline;}
.cfg-char.space{cursor:default;}
.cfg-preview{font-size:12px;color:var(--ok);}
.cfg-row{display:flex;gap:6px;}
.cfg-row .btn{flex:1;}
.cfg-img{display:flex;align-items:center;gap:12px;}
.cfg-img img{max-width:160px;max-height:120px;border-radius:8px;border:1px solid var(--line2);object-fit:contain;background:#000;}
.cfg-empty{color:var(--mute);font-size:12px;}

/* 학습 화면 */
#screen-tree-study{display:flex;flex-direction:column;height:calc(100vh - 56px);}
#trHub{display:flex;flex-direction:column;flex:1;min-height:0;}
.hub-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0;flex-wrap:wrap;}
.hub-summary{font-size:13px;color:var(--sub);}
.hub-note{font-size:12px;color:var(--mute);margin:-4px 0 12px;flex-shrink:0;}

/* 다이어그램 */
.dia{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;}
.dia:fullscreen{background:var(--bg);padding:16px;}
.dia:-webkit-full-screen{background:var(--bg);padding:16px;}
.dia-wrap{
  position:relative;flex:1;min-height:260px;overflow:auto;cursor:grab;user-select:none;touch-action:none;
  background:radial-gradient(circle at 1px 1px,#1b2130 1.2px,transparent 0) 0 0/24px 24px,#07090d;
  border:1px solid var(--line);border-radius:14px;
}
.dia-wrap:active{cursor:grabbing;}
.dia-stage{position:relative;}
.dia-inner{position:absolute;left:0;top:0;transform-origin:0 0;}
.dia-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
.dia-svg path{stroke:#3a445b;stroke-width:2.2;fill:none;stroke-linecap:round;}

.node{
  position:absolute;transform:translate(-50%,-50%);box-sizing:border-box;min-width:56px;padding:8px 11px;border-radius:11px;
  text-align:center;font-size:12.5px;line-height:1.35;background:#121722;border:1.5px solid #2b3447;color:var(--text);
  word-break:keep-all;overflow-wrap:anywhere;z-index:2;transition:background .2s,border-color .2s,box-shadow .2s;
}
.node .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.node.root{background:#1a1d3b;border-color:#5b66c9;font-weight:700;}
.node.done{border-color:#2a6b53;background:#0e1f18;}
.node.pending{border-style:dashed;color:var(--mute);background:#0c1017;}
.node.context{color:var(--sub);}
.node.missed{border-color:#8d3b47;background:#26111a;}
.node.active{
  border-color:var(--accent);background:#171d2f;box-shadow:0 0 0 4px rgba(146,163,255,.16);z-index:6;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;
}
.node.asking{border-color:var(--accent);box-shadow:0 0 0 4px rgba(146,163,255,.2);}
.node.clickable{cursor:pointer;}
.node.clickable:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(146,163,255,.16);}
.node.enter{animation:pop .38s cubic-bezier(.2,.8,.2,1);}
@keyframes pop{from{opacity:0;scale:.82;}to{opacity:1;scale:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.node .thumb{display:block;width:96px;height:76px;object-fit:contain;background:#000;border-radius:7px;margin:0 auto 5px;border:1px solid var(--line2);cursor:zoom-in;}
.in-blank,.in-group{
  background:transparent;border:none;border-bottom:2px solid var(--accent);color:var(--text);text-align:center;
  font-size:12.5px;outline:none;padding:1px 2px;font-family:inherit;
}
.in-blank{min-width:26px;max-width:260px;}
.in-group{width:100%;}
.in-blank.correct{border-bottom-color:var(--ok);color:var(--ok);}
.in-blank.wrong,.in-group.wrong{border-bottom-color:var(--bad);animation:shake .26s;}
.dot-wrong,.dot-child{
  position:absolute;width:17px;height:17px;border-radius:999px;font-size:9px;font-weight:800;border:2px solid #0a0c12;
  display:flex;align-items:center;justify-content:center;z-index:7;
}
.dot-wrong{top:-8px;right:-8px;background:var(--bad);color:#fff;}
.dot-child{bottom:-8px;right:-8px;background:var(--warn);color:#3a2705;}

/* 줌바 / 미니맵 */
.zoom-bar{
  position:absolute;top:12px;right:14px;z-index:30;display:flex;align-items:center;gap:2px;
  background:rgba(14,17,24,.9);border:1px solid var(--line2);border-radius:11px;padding:4px;backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.zb{
  background:transparent;border:none;color:var(--text);border-radius:7px;min-width:30px;height:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 6px;font:inherit;font-size:11px;font-weight:700;transition:background .15s;
}
.zb:hover{background:var(--panel2);}
.zb.label{color:var(--accent);min-width:48px;}
.minimap{
  position:absolute;bottom:14px;right:14px;z-index:30;width:200px;background:rgba(14,17,24,.92);
  border:1px solid var(--line2);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.minimap.collapsed .mm-body{display:none;}
.mm-head{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none;border-bottom:1px solid rgba(255,255,255,.06);}
.minimap.collapsed .mm-head{border-bottom:none;}
.mm-head:hover{color:var(--text);}
.mm-body{height:120px;background:#06080c;cursor:crosshair;}
.mm-svg{width:100%;height:100%;display:block;touch-action:none;}
.mm-e{stroke:#2a3347;stroke-width:3;fill:none;stroke-linecap:round;}
.mm-n{fill:#1b2130;stroke:#323b50;stroke-width:1.5;}
.mm-n.done{fill:#12342a;stroke:#2e7a5c;}
.mm-n.active{fill:#3441b0;stroke:var(--accent);stroke-width:3;}
.mm-n.pending{fill:#141925;stroke:#2a3347;}
.mm-n.missed{fill:#3a1721;stroke:#9a404d;}
.mm-n.root{fill:#272a5a;stroke:#7a86e6;stroke-width:2.5;}
.mm-vp{fill:rgba(146,163,255,.14);stroke:var(--accent);stroke-width:2;rx:3px;}

/* 몰입 학습 오버레이 */
#trStudyProgress{display:flex;flex-direction:column;position:fixed;inset:0;z-index:200;background:var(--bg);}
#trStudyProgress .dia{border-radius:0;}
#trStudyProgress .dia-wrap{border-radius:0;border:none;}
.study-progress{position:absolute;top:0;left:0;right:0;height:3px;z-index:60;background:rgba(255,255,255,.07);}
.study-progress div{height:100%;background:linear-gradient(90deg,var(--accent),#c4a8ff);transition:width .3s ease;}
.study-actions{position:absolute;top:14px;left:16px;z-index:60;display:flex;gap:8px;align-items:center;}
.study-actions .btn{background:rgba(14,17,24,.88);backdrop-filter:blur(8px);}
.chip{
  display:none;font-size:12px;font-weight:700;color:var(--sub);padding:8px 14px;border-radius:10px;
  background:rgba(14,17,24,.88);border:1px solid var(--line2);backdrop-filter:blur(8px);
}
.study-feedback{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:60;font-size:13px;font-weight:600;padding:8px 18px;border-radius:999px;
  background:rgba(14,17,24,.9);border:1px solid var(--line2);backdrop-filter:blur(8px);pointer-events:none;max-width:60vw;text-align:center;
  opacity:0;transition:opacity .15s;
}
.study-feedback:not(:empty){opacity:1;}
.fb.ok{color:var(--ok);} .fb.bad{color:var(--bad);} .fb.warn{color:var(--warn);}

.blank-bar{
  display:none;flex-shrink:0;width:100%;
  background:var(--panel);border-top:1px solid var(--line2);padding:14px 20px 16px;
}
.blank-bar .blank-inner{width:min(640px,100%);margin:0 auto;}
.blank-caption{font-size:12px;color:var(--sub);margin-bottom:9px;}
.blank-caption b{color:var(--accent);font-weight:700;}
.blank-bar input{
  width:100%;background:#080a0f;border:1px solid var(--line2);color:var(--text);border-radius:11px;padding:13px 15px;
  font-size:15px;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;
}
.blank-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(146,163,255,.15);}
.blank-bar input:disabled{opacity:.45;}
.blank-bar input.wrong{border-color:var(--bad);animation:shake .28s;}
.blank-keys{margin-top:9px;font-size:11px;color:var(--mute);display:flex;gap:16px;}
kbd{font:inherit;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--sub);margin-right:5px;}
#trStudyProgress.mode-blank .study-progress{display:none;}
#trStudyProgress.mode-blank .blank-bar{display:block;}
#trStudyProgress.mode-blank .chip{display:block;}
#trStudyProgress.mode-blank #btnZbTarget{display:none;}
@media (max-width:900px){ .editor{grid-template-columns:1fr;} }

/* 모달 / 토스트 / 라이트박스 / 드롭 */
.modal{position:fixed;inset:0;z-index:9000;background:rgba(5,7,10,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;}
.modal-card{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:28px;width:min(400px,90vw);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.modal-title{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
.modal-stats{font-size:13px;color:var(--sub);margin-bottom:22px;line-height:1.7;}
.modal-stats b{font-size:22px;font-weight:800;display:block;margin-bottom:4px;color:var(--text);}
.modal-stats .ok{color:var(--ok);} .modal-stats .bad{color:var(--bad);}
.modal-card .row{justify-content:center;}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:9500;background:#1b2030;border:1px solid var(--line2);
  color:var(--text);font-size:13px;font-weight:600;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 12px 36px rgba(0,0,0,.5);max-width:80vw;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
.lightbox{position:fixed;inset:0;z-index:9800;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:24px;}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:12px;box-shadow:0 10px 50px rgba(0,0,0,.6);}
#dropOverlay{
  position:fixed;inset:0;z-index:9900;background:rgba(9,11,16,.88);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .2s;
}
#dropOverlay.active{opacity:1;pointer-events:all;}
.drop-box{background:var(--panel);border:2px dashed var(--accent);border-radius:24px;padding:44px 56px;text-align:center;max-width:540px;width:90%;}
.drop-box .ic{width:44px;height:44px;color:var(--accent);margin-bottom:14px;}
.drop-title{font-size:19px;font-weight:800;color:var(--accent);margin-bottom:8px;}
.drop-sub{font-size:13px;color:var(--sub);line-height:1.6;}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }

/* =========================================================================
 * v2 디자인: 테두리 제거 · 면(tonal) 위주 · 부드러운 그림자 / 모바일(iPhone 12 mini 375px)
 * ========================================================================= */
:root{--r:14px;--sh:0 1px 2px rgba(0,0,0,.28),0 8px 24px -8px rgba(0,0,0,.45);--panel2:#161a24;--panel3:#1d2230;}
body{background:radial-gradient(900px 460px at 50% -160px,#1a2340 0%,transparent 70%),var(--bg);}
.btn,.btn-sm,.pill,.chip,.cfg,.cfg-text,.cfg-char,.brand-mark,.form-group input,#trOutlineInput,.preview,.pv-row,.pv-thumb,.mm-head,
.minimap,.zoom-bar,.zb,.modal-card,.blank-bar input,.in-blank,.in-group,kbd,.drop-box,.node,.node .thumb,.lightbox img,.card{border-color:transparent !important;}
.btn{background:var(--panel3);border-radius:12px;box-shadow:none;}
.btn:hover{background:#262d40;}
.btn-primary{background:linear-gradient(135deg,#8c9dff,#a58bff);color:#0b0d16;}
.btn-primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,#8c9dff,#a58bff);}
.btn-danger{background:var(--bad-bg);color:var(--bad);}
.btn-danger:hover{background:rgba(255,123,136,.2);}
.card{background:var(--panel2);border-radius:18px;box-shadow:var(--sh);padding:20px;}
.card:hover{background:#1a1f2c;transform:translateY(-2px);}
.card.folder{background:linear-gradient(160deg,#1c2040,#151829);}
.card.drop-before{outline:2px solid var(--accent) !important;}
.form-group input,#trOutlineInput,.preview,.blank-bar input{background:var(--panel2);border-radius:12px;}
.form-group input:focus,#trOutlineInput:focus,.blank-bar input:focus{box-shadow:0 0 0 2px rgba(146,163,255,.45);}
.pill,.cfg,.cfg-text,.cfg-char{background:var(--panel3);}
.pill.on{background:var(--accent-bg);color:var(--accent);}
.modal-card{background:var(--panel2);border-radius:22px;}
.dia-wrap{background:#0c0f16;border:none !important;border-radius:18px;}
.minimap,.zoom-bar{background:rgba(22,26,36,.82);backdrop-filter:blur(10px);box-shadow:var(--sh);border-radius:12px;}
.mm-head{border-bottom:none !important;}
.node{background:#171b27;box-shadow:0 2px 10px rgba(0,0,0,.35);}
.node.root{background:#232859;}

<script>
'use strict';
/* =========================================================================
 * 0. 공용 유틸
 * ========================================================================= */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const icon = (n, cls = '') => `<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* =========================================================================
 * 1. 저장소 (window.storage + IndexedDB + localStorage) - 저장 키/형식은 기존과 동일
 * ========================================================================= */
const KEY_TREES = 'quiz_trees';
const KEY_WRONG = 'quiz_tree_wrong_nodes';
const KEY_FOLDERS = 'quiz_tree_folders';
let TREES = {}, TREE_WRONG = {}, TREE_FOLDERS = {};
// TreeNode = { id, label, children, blankMask, image }

const DB_NAME = 'TypingQuizDB', DB_VERSION = 1, STORE = 'keyval';
let dbPromise = null;
function getDB() {
  if (!dbPromise) dbPromise = new Promise(resolve => {
    if (!window.indexedDB) return resolve(null);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => resolve(null);
  });
  return dbPromise;
}
async function idbGet(key) {
  try {
    const db = await getDB(); if (!db) return null;
    return await new Promise(res => {
      const r = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
      r.onsuccess = () => res(r.result !== undefined ? r.result : null);
      r.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function idbSet(key, value) {
  try {
    const db = await getDB(); if (!db) return false;
    return await new Promise(res => {
      const r = db.transaction(STORE, 'readwrite').objectStore(STORE).put(value, key);
      r.onsuccess = () => res(true); r.onerror = () => res(false);
    });
  } catch (e) { return false; }
}
async function loadFromStorage(key) {
  try {
    if (window.storage && window.storage.get) {
      const res = await window.storage.get(key, false);
      if (res && res.value) return JSON.parse(res.value);
    }
  } catch (e) {}
  const val = await idbGet(key);
  if (val !== null) { try { return typeof val === 'string' ? JSON.parse(val) : val; } catch (e) {} }
  try {
    const raw = localStorage.getItem(key);
    if (raw) { const parsed = JSON.parse(raw); idbSet(key, parsed); return parsed; }
  } catch (e) {}
  return null;
}
async function saveToStorage(key, obj) {
  const json = JSON.stringify(obj);
  try { localStorage.setItem(key, json); } catch (e) {}   // 동기 저장을 먼저(페이지 종료 대비)
  try { if (window.storage && window.storage.set) await window.storage.set(key, json, false); } catch (e) {}
  await idbSet(key, obj);
}
const saveTrees = () => saveToStorage(KEY_TREES, TREES);
const saveTreeWrong = () => saveToStorage(KEY_WRONG, TREE_WRONG);
const saveTreeFolders = () => saveToStorage(KEY_FOLDERS, TREE_FOLDERS);
let wrongTimer = null;
function saveTreeWrongSoon() { clearTimeout(wrongTimer); wrongTimer = setTimeout(() => { wrongTimer = null; saveTreeWrong(); }, 400); }
window.addEventListener('pagehide', () => { if (wrongTimer) { clearTimeout(wrongTimer); wrongTimer = null; saveTreeWrong(); } });

/* =========================================================================
 * 2. 오답 추적
 * ========================================================================= */
function markNodeMistake(treeId, nodeId) {
  const m = TREE_WRONG[treeId] || (TREE_WRONG[treeId] = {});
  const cur = m[nodeId] || { miss: 0, lastAt: 0 };
  cur.miss += 1; cur.lastAt = Date.now();
  m[nodeId] = cur;
  saveTreeWrongSoon();
}
function markNodeMastered(treeId, nodeId) {
  const m = TREE_WRONG[treeId];
  if (m && m[nodeId]) {
    delete m[nodeId];
    if (!Object.keys(m).length) delete TREE_WRONG[treeId];
    saveTreeWrongSoon();
  }
}
const getWrongMap = id => TREE_WRONG[id] || {};
const getWrongCount = id => Object.keys(getWrongMap(id)).length;
function pruneStaleWrongEntries(tree) {
  const wm = TREE_WRONG[tree.id]; if (!wm) return false;
  const valid = new Set(flattenTreeDFS(tree.root).map(n => n.id));
  let changed = false;
  for (const id of Object.keys(wm)) if (!valid.has(id)) { delete wm[id]; changed = true; }
  if (!Object.keys(wm).length) delete TREE_WRONG[tree.id];
  return changed;
}
function getWrongNodeList(tree) {
  const wm = getWrongMap(tree.id);
  const found = flattenTreeBFS(tree.root).filter(x => wm[x.node.id]);
  found.sort((a, b) => (wm[b.node.id].miss - wm[a.node.id].miss) || (a.depth - b.depth));
  return found;
}

/* =========================================================================
 * 3. 정답 판정
 * ========================================================================= */
const normalize = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const cleanText = s => String(s || '').replace(/[\s.,/·~+_\-–—()[\]{}!?:;'"“”‘’`]+/g, '').toLowerCase();
function extractKeywords(s) {
  return String(s || '').trim().split(/[\s,()[\]{}·/\\~+\-_:;'"“”‘’`]+/).map(cleanText).filter(k => k.length > 0);
}
function singleMatch(typedRaw, targetRaw) {
  const tn = normalize(typedRaw), gn = normalize(targetRaw);
  if (!gn || !tn) return false;
  if (tn === gn || tn.includes(gn)) return true;
  const tc = cleanText(typedRaw), gc = cleanText(targetRaw);
  if (tc && gc && (tc === gc || tc.includes(gc))) return true;
  const kws = extractKeywords(targetRaw);
  if (kws.length >= 2) {
    let last = 0;
    for (const kw of kws) {
      const idx = tc.indexOf(kw, last);
      if (idx === -1) return false;
      last = idx + kw.length;
    }
    return true;
  }
  return false;
}

/* =========================================================================
 * 4. 부분 빈칸 유틸
 * ========================================================================= */
const defaultBlankMask = label => '1'.repeat(label.length);
const getBlankMask = n => (n.blankMask && n.blankMask.length === n.label.length) ? n.blankMask : defaultBlankMask(n.label);
function buildBlankSegments(label, mask) {
  const out = []; let i = 0;
  while (i < label.length) {
    const bit = mask[i]; let j = i;
    while (j < label.length && mask[j] === bit) j++;
    const text = label.slice(i, j);
    out.push({ blank: bit === '1' && text.trim() !== '', text });
    i = j;
  }
  return out;
}

/* =========================================================================
 * 5. 트리 구조 / 파서
 * ========================================================================= */
const uid = p => p + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
const genTreeId = () => uid('tr_'), genNodeId = () => uid('n_'), genFolderId = () => uid('fld_');
const makeTreeNode = label => ({ id: genNodeId(), label, children: [], blankMask: null, image: null });

/* "[[졸본]]건국" → label "졸본건국", mask "110 0"(1=빈칸). 괄호가 없으면 mask=null */
function extractBracketBlanks(raw) {
  if (!/\[\[[\s\S]*?\]\]/.test(raw)) return { label: raw, mask: null };
  let label = '', mask = '', last = 0, m, found = false;
  const re = /\[\[([\s\S]*?)\]\]/g;
  while ((m = re.exec(raw))) {
    const before = raw.slice(last, m.index);
    label += before; mask += '0'.repeat(before.length);
    label += m[1]; mask += '1'.repeat(m[1].length);
    if (m[1].trim()) found = true;
    last = m.index + m[0].length;
  }
  const rest = raw.slice(last);
  label += rest; mask += '0'.repeat(rest.length);
  return { label, mask: found ? mask : null };
}
function parseOutlineToTree(text) {
  const root = makeTreeNode('루트');

  const folder = currentFolderId && TREE_FOLDERS[currentFolderId];
  if (currentFolderId && !folder) currentFolderId = null;
  if (currentFolderId) { back.classList.remove('hidden'); title.textContent = folder.name; }
  else { back.classList.add('hidden'); title.textContent = '내 구조도'; }

  const items = currentScopeItems();
  if (!items.length) {
    grid.innerHTML = `<div class="empty-msg">${currentFolderId ? '비어 있음' : '구조도 없음'}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  items.forEach(it => frag.appendChild(it.type === 'folder' ? buildFolderCard(it.obj) : buildTreeCard(it.obj)));
  grid.replaceChildren(frag);
}

function buildFolderCard(folder) {
  const count = getFolderItems(folder.id).length;
  const card = document.createElement('div');
  card.className = 'card folder';
  card.innerHTML = `
    <div class="card-title">${icon('folder', 'lg')}<span>${escapeHtml(folder.name)}</span></div>
    <div class="card-meta"><span>구조도 ${count}개</span></div>
    <div class="card-actions">
      <button class="btn btn-sm btn-primary" data-act="open">열기</button>
      <button class="btn btn-sm" data-act="rename">${icon('edit')}이름 변경</button>
      <button class="btn btn-sm btn-danger icon-only" data-act="del" title="삭제">${icon('trash')}</button>
    </div>`;
  card.querySelector('[data-act="open"]').onclick = () => { currentFolderId = folder.id; renderTreeList(); };
  card.querySelector('[data-act="rename"]').onclick = async () => {
    const name = prompt('폴더 이름을 입력하세요', folder.name);
    if (!name || !name.trim()) return;
    folder.name = name.trim(); await saveTreeFolders(); renderTreeList();
  };
  card.querySelector('[data-act="del"]').onclick = async () => {
    const items = getFolderItems(folder.id);
    if (!confirm(`"${folder.name}" 폴더를 삭제할까요?${items.length ? ` (안의 구조도 ${items.length}개는 전체 목록으로 이동됩니다)` : ''}`)) return;
    const rootN = getRootItems().length;
    items.forEach((it, i) => { it.obj.folderId = null; it.obj.order = (rootN + i + 1) * 10; });
    delete TREE_FOLDERS[folder.id];
    await saveTrees(); await saveTreeFolders(); renderTreeList();
  };
  makeDraggable(card, 'folder', folder.id, true);
  return card;
}

function buildTreeCard(tree) {
  const nodeCount = flattenTreeDFS(tree.root).length, wrong = getWrongCount(tree.id);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-title">${escapeHtml(tree.title)}</div>
    <div class="card-meta"><span>노드 ${nodeCount}개</span>${wrong ? `<span class="meta-wrong">오답 ${wrong}개</span>` : ''}</div>
    <div class="card-actions">
      <button class="btn btn-sm btn-primary" data-act="study">${icon('play')}학습</button>
      <button class="btn btn-sm" data-act="blank">${icon('blank')}백지</button>
      <button class="btn btn-sm" data-act="edit">${icon('edit')}편집</button>
      <button class="btn btn-sm icon-only" data-act="export" title="MD로 내보내기">${icon('out')}</button>
      <button class="btn btn-sm btn-danger icon-only" data-act="del" title="삭제">${icon('trash')}</button>
    </div>
    ${currentFolderId ? `<button class="btn btn-sm btn-block" data-act="unfile">${icon('out')}폴더에서 빼기</button>` : ''}`;
  card.querySelector('[data-act="study"]').onclick = () => openTreeStudy(tree.id, 'hub');

    if (!confirm(`"${tree.title}" 구조도를 삭제할까요? (오답 기록도 함께 삭제됩니다)`)) return;
    delete TREES[tree.id]; delete TREE_WRONG[tree.id];
    await saveTrees(); await saveTreeWrong(); renderTreeList();
  };
  const unfile = card.querySelector('[data-act="unfile"]');
  if (unfile) unfile.onclick = () => removeTreeFromFolder(tree.id);
  makeDraggable(card, 'tree', tree.id, false);
  return card;

function renderTreePreview() {
  const wrap = $('trPreview'), root = treeEdit.root;
  if (!root || !root.children.length) {
    wrap.innerHTML = ''; return;
  }
  const frag = document.createDocumentFragment();
  (function walk(node, depth) {
    node.children.forEach(child => {
      const hasBlank = !!child.blankMask, hasImg = !!child.image;
      const row = document.createElement('div');
      row.className = 'pv-row'; row.style.paddingLeft = (depth * 16 + 6) + 'px';
      row.innerHTML = `
        <span class="pv-mark ${child.children.length ? 'branch' : ''}"></span>
        <span class="pv-label">${hasImg ? `<img class="pv-thumb" src="${child.image}">` : ''}<span>${escapeHtml(child.label)}</span></span>
        <button type="button" class="pill ${hasImg ? 'on' : ''}" data-k="img">${hasImg ? '사진 있음' : '사진 추가'}</button>
        <button type="button" class="pill ${hasBlank ? 'on' : ''}" data-k="blank">${hasBlank ? '부분 빈칸' : '빈칸 설정'}</button>`;
      const blankHolder = document.createElement('div'), imgHolder = document.createElement('div');
      row.querySelector('[data-k="blank"]').onclick = () => {
        imgHolder.innerHTML = '';
        if (blankHolder.childElementCount) { blankHolder.innerHTML = ''; return; }
        blankHolder.appendChild(buildBlankConfigPanel(child, renderTreePreview));
      };
      row.querySelector('[data-k="img"]').onclick = () => {
        blankHolder.innerHTML = '';
        if (imgHolder.childElementCount) { imgHolder.innerHTML = ''; return; }
        imgHolder.appendChild(buildImageConfigPanel(child, renderTreePreview));
      };
      frag.append(row, imgHolder, blankHolder);
      walk(child, depth + 1);
    });
  })(root, 0);
  wrap.replaceChildren(frag);
}

function buildBlankConfigPanel(node, onChange) {
  const panel = document.createElement('div'); panel.className = 'cfg';
  let mask = getBlankMask(node).split('');
  const box = document.createElement('div'); box.className = 'cfg-text';
  const prev = document.createElement('div'); prev.className = 'cfg-preview';
  panel.append(box, prev);
  function draw() {
    box.innerHTML = '';
    node.label.split('').forEach((ch, i) => {
      const sp = document.createElement('span'), isSpace = /\s/.test(ch);
      sp.className = 'cfg-char' + (isSpace ? ' space' : '') + (mask[i] === '1' ? ' blank' : '');
      sp.textContent = ch;
      if (!isSpace) sp.onclick = () => { mask[i] = mask[i] === '1' ? '0' : '1'; draw(); };
      box.appendChild(sp);
    });
    prev.textContent = '미리보기: ' + buildBlankSegments(node.label, mask.join('')).map(s => s.blank ? '_'.repeat(Math.max(1, s.text.length)) : s.text).join('');
  }
  draw();
  const mk = (t, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-sm ' + cls; b.textContent = t; b.onclick = fn; return b; };
  const quick = document.createElement('div'); quick.className = 'cfg-row';
  quick.append(mk('전체 빈칸(기본)', '', () => { mask = defaultBlankMask(node.label).split(''); draw(); }),
               mk('전체 공개', '', () => { mask = node.label.split('').map(() => '0'); draw(); }));
  const act = document.createElement('div'); act.className = 'cfg-row';
  act.append(mk('저장', 'btn-primary', () => {
    const fm = mask.join('');
    node.blankMask = fm === defaultBlankMask(node.label) ? null : fm; node.bracket = false; onChange();
  }), mk('닫기', '', () => panel.remove()));
  panel.append(quick, act);
  return panel;
}

function resizeImageFile(file, maxDim = 640, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const r = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * r); height = Math.round(height * r);
        }
        const cv = document.createElement('canvas'); cv.width = width; cv.height = height;
        cv.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function buildImageConfigPanel(node, onChange) {
  const panel = document.createElement('div'); panel.className = 'cfg';
  const pv = document.createElement('div'); pv.className = 'cfg-img'; panel.appendChild(pv);
  function draw() {
    pv.innerHTML = '';
    if (node.image) { const i = document.createElement('img'); i.src = node.image; pv.appendChild(i); }
    else { const d = document.createElement('div'); d.className = 'cfg-empty'; d.textContent = '사진 없음'; pv.appendChild(d); }
  }
  draw();
  const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*'; fi.style.display = 'none'; panel.appendChild(fi);
  fi.onchange = async () => {
    const f = fi.files && fi.files[0]; if (!f) return;
    try { node.image = await resizeImageFile(f); draw(); onChange(); }
    catch (e) { toast('사진을 불러오지 못했습니다'); }
    finally { fi.value = ''; }
  };
  const mk = (t, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-sm'; b.textContent = t; b.onclick = fn; return b; };
  const row = document.createElement('div'); row.className = 'cfg-row';
  row.append(mk(node.image ? '사진 바꾸기' : '사진 선택', () => fi.click()),
             mk('사진 삭제', () => { if (!node.image) return; node.image = null; draw(); onChange(); }),
             mk('닫기', () => panel.remove()));
  panel.appendChild(row);
  return panel;
}

  S.tree = TREES[treeId];

}

/* =========================================================================
 * 12. 일반 학습 (빈칸 입력 방식)
 * ========================================================================= */
function groupIntoUnits(nodes) {
  const units = []; let i = 0;
  while (i < nodes.length) {
    const p = S.parentOf.get(nodes[i].id), pid = p ? p.id : null;
    const unit = [nodes[i]]; let j = i + 1;
    while (j < nodes.length) {
      const p2 = S.parentOf.get(nodes[j].id);
      if ((p2 ? p2.id : null) === pid) { unit.push(nodes[j]); j++; } else break;
    }
    units.push(unit); i = j;
  }
  return units;
}
function beginStudySession(nodes, wrongReview) {
  if (!nodes.length) return;
  S.token++; S.mode = 'study';
  S.list = groupIntoUnits(nodes); S.target = new Set(nodes.map(n => n.id));
  S.answered = new Set(); S.index = 0; S.wrongReview = !!wrongReview;
  $('trStudyHeader').classList.add('hidden'); $('trHub').classList.add('hidden');
  const prog = $('trStudyProgress'); prog.classList.remove('hidden', 'mode-blank');
  studyView.clear();
  studyView.onTarget = () => studyView.centerOnNode(S.cur[0] && S.cur[0].id);
  renderStudyStep();
}
function startFocusedStudy(node) {
  const flat = flattenTreeBFS(node); if (!flat.length) return;
  beginStudySession(flat.map(x => x.node), false);
}
$('btnTrStudyAll').addEventListener('click', () => beginStudySession(flattenTreeBFS(S.tree.root).map(x => x.node), false));
$('btnTrStudyWrong').addEventListener('click', () => beginStudySession(getWrongNodeList(S.tree).map(x => x.node), true));
$('btnTrStudyBlank').addEventListener('click', beginBlankSession);

function nodeState(n) {
  if (S.curIds.has(n.id) && !S.answered.has(n.id)) return 'active';
  if (S.answered.has(n.id)) return 'done';
  if (S.target.has(n.id)) return 'pending';
  return 'context';
}
function renderStudyStep() {
  const unit = S.list[S.index];
  S.cur = unit; S.curIds = new Set(unit.map(n => n.id));
  $('trStudyBar').style.width = `${((S.index + 1) / S.list.length) * 100}%`;
  setFeedback('', '');
  S.canAdvance = false; S.mistake = false;
  drawStudy();
  studyView.centerOnNode(unit[0].id, true);
}
function finalizeNodeOutcome(node) {
  if (S.mistake) markNodeMistake(S.tree.id, node.id); else markNodeMastered(S.tree.id, node.id);
}
/* 터치 기기: 입력칸이 DOM 에서 사라져도 키보드가 내려가지 않도록 '항상 존재하는' 숨김 입력칸이 포커스를 잠시 넘겨받는다 */
const IS_TOUCH = window.matchMedia('(pointer:coarse)').matches || /iPad|iPhone|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const kbKeeper = $('kbKeeper');
function keepKeyboard() {
  if (!IS_TOUCH) return;
  const a = document.activeElement;
  if (a && a !== kbKeeper && a.tagName === 'INPUT' && a.closest('#trStudyProgress')) kbKeeper.focus({ preventScroll: true });
}
function releaseKeyboard() { if (document.activeElement === kbKeeper) kbKeeper.blur(); }
['btnTrStudyBackFloat', 'btnTrBackToHub', 'btnDoneHub'].forEach(id => { const b = $(id); if (b) b.addEventListener('click', releaseKeyboard); });
function drawStudy() {
  keepKeyboard();
  S.focusEl = null;
  studyView.stateOf = id => nodeState(S.byId.get(id));
  studyView.sync(S.layout, fillStudy, false);
  let f = S.focusEl;
  if (S.cur.length > 1) {
    f = null;   // 그룹은 항상 '아직 못 맞힌 첫 번째 노드'에 포커스
    for (const n of S.cur) {
      if (S.answered.has(n.id)) continue;
      const el = studyView.nodes.get(n.id), inp = el && el.querySelector('input.in-group, input.in-blank:not(:disabled)');
      if (inp) { f = inp; break; }
    }
  } else if (!f && S.cur.length > 1) {
    for (const n of S.cur) {
      if (S.answered.has(n.id)) continue;
      const el = studyView.nodes.get(n.id), inp = el && el.querySelector('input.in-group, input.in-blank:not(:disabled)');
      if (inp) { f = inp; break; }
    }
  }
  if (f) {
    if (IS_TOUCH) f.focus({ preventScroll: true });   // 동기 포커스: keeper → 새 입력칸 (키보드 유지)
    setTimeout(() => { if (document.activeElement !== f && document.contains(f)) f.focus({ preventScroll: true }); }, 0);
  }
}
function fillStudy(el, id) {
  const node = S.byId.get(id), isRoot = id === S.tree.root.id;
  const st = isRoot ? 'root' : nodeState(node);
  if (el.dataset.state === st) return;
  el.dataset.state = st; el.replaceChildren(); el.removeAttribute('title');
  if (isRoot) {
    el.className = 'node root'; addText(el, S.tree.title); attachImage(el, node);
  } else if (st === 'active') {
    el.className = 'node active';
    if (S.cur.length > 1 && !S.wrongReview && hasPartialBlank(node)) renderCloze(el, node);
    else if (S.cur.length > 1) { const gi = renderGroupInput(el, node); if (!S.focusEl) S.focusEl = gi; }
    else if (S.wrongReview) S.focusEl = renderFullInput(el, node);
    else renderCloze(el, node);
    attachImage(el, node);
  } else if (st === 'done') {
    el.className = 'node done'; addText(el, node.label); attachImage(el, node); el.title = node.label;
  } else if (st === 'pending') {
    el.className = 'node pending'; addText(el, '?');
  } else {
    el.className = 'node context'; addText(el, node.label); attachImage(el, node); el.title = node.label;
  }
  if (node.children.length) addChildDot(el, node.children.length);
}

      const id = genTreeId();

        folderId: currentFolderId, order: (base + 1 + made.length) * 10 };

  }
  if (made.length) {
    await saveTrees(); showScreen(screenList); renderTreeList();
    toast(made.length === 1 ? `"${made[0]}" 구조도를 만들었습니다` : `${made.length}개의 구조도를 만들었습니다`);
  }
}

  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; dropOverlay.classList.remove('active');
  if (e.dataTransfer.files.length) await importMdFiles(e.dataTransfer.files);
});

/* =========================================================================
 * 15. 초기화
 * ========================================================================= */
async function init() {
  [TREES, TREE_WRONG, TREE_FOLDERS] = await Promise.all([
    loadFromStorage(KEY_TREES), loadFromStorage(KEY_WRONG), loadFromStorage(KEY_FOLDERS),
  ]).then(r => r.map(v => v || {}));

  const trees = Object.values(TREES).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  let ord = 10;
  trees.forEach(t => {
    if (t.folderId === undefined) t.folderId = null;
    if (t.order === undefined || t.order === null) t.order = ord;
    ord += 10;
  });
  let fo = 10;
  Object.values(TREE_FOLDERS).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach(f => {
    if (f.order === undefined || f.order === null) f.order = fo;
    fo += 10;
  });
  let changed = false;
  trees.forEach(t => { if (pruneStaleWrongEntries(t)) changed = true; });
  if (changed) await saveTreeWrong();

  renderTreeList(); showScreen(screenList);
}
init();
</script>
